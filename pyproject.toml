[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiplat"
version = "0.1.0"
description = "Tooling for a small self-hosted AI platform: gateway client, health checks, model evaluation, MCP server and secrets helpers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Akshitaa Vijayakumar" }]
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.12,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pyyaml>=6"]

[project.scripts]
aiplat = "aiplat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
